<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="330" rx="14" fill="#0f172a"/><text x="400.0" y="30" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">RAG: Retrieval-Augmented Generation</text><text x="20" y="62" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="start">1) INDEXING (offline, done once)</text><rect x="30" y="75" width="150" height="50" rx="10" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-width="2"/><text x="105.0" y="105.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">Documents</text><rect x="220" y="75" width="150" height="50" rx="10" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-width="2"/><text x="295.0" y="105.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">Chunks</text><rect x="410" y="75" width="150" height="50" rx="10" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="2"/><text x="485.0" y="105.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">Embeddings</text><rect x="600" y="75" width="150" height="50" rx="10" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="2"/><text x="675.0" y="105.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">Vector DB</text><line x1="180" y1="100" x2="220" y2="100" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><line x1="370" y1="100" x2="410" y2="100" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><line x1="560" y1="100" x2="600" y2="100" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><circle r="6" fill="#38bdf8"><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M105 100 L675 100"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="4s" begin="0s" repeatCount="indefinite"/></circle><text x="20" y="168"