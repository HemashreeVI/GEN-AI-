<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="300" rx="14" fill="#0f172a"/><text x="400.0" y="30" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">MCP: one standard plug between AI apps and tools</text><rect x="60" y="105" width="240" height="90" rx="10" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="2"/><text x="180.0" y="150.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">AI App (MCP Host)</text><text x="180.0" y="167.0" fill="#94a3b8" font-size="11" text-anchor="middle">contains the MCP client</text><rect x="560" y="55" width="200" height="60" rx="10" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-width="2"/><text x="660.0" y="85.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">GitHub Server</text><text x="660.0" y="102.0" fill="#94a3b8" font-size="11" text-anchor="middle">repos, issues, PRs</text><line x1="300" y1="150" x2="560" y2="85" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><circle r="6" fill="#38bdf8"><animateMotion dur="3s" begin="0.0s" repeatCount="indefinite" path="M300 150 L560 85"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><rect x="560" y="125" width="200" height="60" rx="10" fill="#34d399" fill-opacity=".18" stroke="#34d399" stroke-width="2"/><text x="660.0" y="155.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">Drive Server</text><text x="660.0" y="172.0" fill="#94a3b8" font-size="11" text-anchor="middle">files, docs</text><line x1="300" y1="150" x2="560" y2="155" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><circle r="6" fill="#34d399"><animateMotion dur="3s" begin="0.8s" repeatCount="indefinite" path="M300 150 L560 155"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle><rect x="560" y="195" width="200" height="60" rx="10" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24" stroke-width="2"/><text x="660.0" y="225.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">Database Server</text><text x="660.0" y="242.0" fill="#94a3b8" font-size="11" text-anchor="middle">SQL queries</text><line x1="300" y1="150" x2="560" y2="225" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><circle r="6" fill="#fbbf24"><animateMotion dur="3s" begin="1.6s" repeatCount="indefinite" path="M300 150 L560 225"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle><text x="430" y="100" fill="#cbd5e1" font-size="12" font-weight="700" text-anchor="middle">JSON-RPC 2.0</text><text x="430" y="275" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="middle">Servers expose: Tools (actions) · Resources (data) · Prompts (templates)</text></svg>