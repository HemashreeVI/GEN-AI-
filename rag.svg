troke-width="2" stroke-dasharray="5 4"/><rect x="500" y="265" width="270" height="45" rx="10" fill="#34d399" fill-opacity=".18" stroke="#34d399" stroke-width="2"/><text x="635.0" y="292.5" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle"></text><text x="635" y="293" fill="#6ee7b7" font-size="14" font-weight="700" text-anchor="middle" opacity="0">Grounded answer + sources<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.56;.92;1" dur="4s" repeatCount="indefinite"/></text><text x="30" y="293" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="start">Model answers from YOUR data, so fewer hallucinations.</text></svg>