<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="330" rx="14" fill="#0f172a"/><text x="400.0" y="30" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">Zero-shot vs Few-shot prompting</text><rect x="20" y="50" width="370" height="260" rx="10" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-width="2"/><text x="205.0" y="185.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle"></text><rect x="410" y="50" width="370" height="260" rx="10" fill="#34d399" fill-opacity=".18" stroke="#34d399" stroke-width="2"/><text x="595.0" y="185.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle"></text><text x="205" y="78" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">ZERO-SHOT (instruction only)</text><text x="595" y="78" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">FEW-SHOT (instruction + examples)</text><rect x="40" y="95" width="330" height="70" rx="10" fill="#475569" fill-opacity=".18" stroke="#475569" stroke-width="2"/><text x="205.0" y="135.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">Classify the sentiment:</text><text x="205" y="145" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="middle">'The battery dies so fast.'</text><rect x="430" y="90" width="330" height="125" rx="10" fill="#475569" fill-opacity=".18" stroke="#475569" stroke-width="2"/><text x="595.0" y="157.5" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle"></text><text x="445" y="112" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="start">'Loved it!'  →  Positive</text><text x="445" y="138" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="start">'Waste of money'  →  Negative</text><text x="445" y="164" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="start">'Works great'  →  Positive</text><text x="445" y="190" fill="#cbd5e1" font-size="13" font-weight="400" text-anchor="start">'The battery dies so fast.'  →  ?</text><line x1="205" y1="165" x2="205" y2="225" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><line x1="595" y1="215" x2="595" y2="255" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><circle r="6" fill="#38bdf8"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M205 165 L205 225"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="3s" begin="0s" repeatCount="indefinite"/></circle><circle r="6" fill="#34d399"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M595 215 L595 255"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="3s" begin="0s" repeatCount="indefinite"/></circle><rect x="105" y="225" width="200" height="60" rx="10" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-width="2"/><text x="205.0" y="260.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle"></text><rect x="495" y="255" width="200" height="40" rx="10" fill="#34d399" fill-opacity=".18" stroke="#34d399" stroke-width="2"/><text x="595.0" y="280.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle"></text><text x="205" y="262" fill="#7dd3fc" font-size="18" font-weight="700" text-anchor="middle" opacity="0">Negative<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.46;.92;1" dur="8s" repeatCount="indefinite"/></text><text x="595" y="281" fill="#6ee7b7" font-size="16" font-weight="700" text-anchor="middle" opacity="0">Negative<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.46;.92;1" dur="8s" repeatCount="indefinite"/></text><text x="205" y="300" fill="#94a3b8" font-size="11" font-weight="400" text-anchor="middle">Relies on pre-trained knowledge</text><text x="595" y="310" fill="#94a3b8" font-size="11" font-weight="400" text-anchor="middle">Examples teach format, tone and edge cases</text></svg>