<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" font-family="Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="270" rx="14" fill="#0f172a"/><text x="400.0" y="30" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">API: request and response over HTTP</text><rect x="30" y="70" width="170" height="70" rx="10" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8" stroke-width="2"/><text x="115.0" y="105.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">Your App</text><text x="115.0" y="122.0" fill="#94a3b8" font-size="11" text-anchor="middle">Python / JS / curl</text><rect x="315" y="70" width="170" height="70" rx="10" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24" stroke-width="2"/><text x="400.0" y="105.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">API Server</text><text x="400.0" y="122.0" fill="#94a3b8" font-size="11" text-anchor="middle">auth + rate limits</text><rect x="600" y="70" width="170" height="70" rx="10" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="2"/><text x="685.0" y="105.0" fill="#f1f5f9" font-size="14" font-weight="600" text-anchor="middle">LLM</text><text x="685.0" y="122.0" fill="#94a3b8" font-size="11" text-anchor="middle">generates tokens</text><line x1="200" y1="105" x2="315" y2="105" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><line x1="485" y1="105" x2="600" y2="105" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><circle r="6" fill="#38bdf8"><animateMotion dur="3.5s" begin="0s" repeatCount="indefinite" path="M200 105 L600 105"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="3.5s" begin="0s" repeatCount="indefinite"/></circle><text x="257" y="92" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">POST</text><line x1="600" y1="190" x2="30" y2="190" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><circle r="6" fill="#34d399"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite" path="M600 190 L100 190"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="3.5s" begin="1.75s" repeatCount="indefinite"/></circle><text x="400" y="170" fill="#7dd3fc" font-size="12" font-weight="400" text-anchor="middle">Request: {"model", "messages", "max_tokens"}</text><text x="400" y="218" fill="#6ee7b7" font-size="12" font-weight="400" text-anchor="middle">Response: {"content", "usage": {input_tokens, output_tokens}}</text><text x="400" y="250" fill="#94a3b8" font-size="12" font-weight="400" text-anchor="middle">API key goes in a header. Never put it in GitHub or frontend code.</text></svg>